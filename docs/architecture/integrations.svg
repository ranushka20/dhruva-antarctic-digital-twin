<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Antarasetu connects to six things: Saved Data (save and load), NCPOR Weather (live data), Climate Records (loads), the Station (sync), Reports (download), and Future Sensors (planned).">
  <style><![CDATA[
    .nm { font: 700 18px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .nm-g { font: 700 18px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8c959f; }
    .lb { font: 600 15px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .lb-g { font: 600 15px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8c959f; }
    .ct { font: 700 20px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
  ]]></style>
  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Lines -->
  <g fill="none" stroke="#1f2328" stroke-width="2" stroke-dasharray="8 6">
    <path d="M500 132 V228"/>
    <path d="M500 412 V488"/>
    <path d="M398 270 H110 V196"/>
    <path d="M398 370 H110 V444"/>
    <path d="M602 270 H890 V196"/>
  </g>
  <path d="M602 370 H890 V444" fill="none" stroke="#b6bec7" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Line labels (white gap on the line) -->
  <g fill="#ffffff">
    <rect x="452" y="166" width="96" height="28"/>
    <rect x="456" y="436" width="88" height="28"/>
    <rect x="212" y="256" width="86" height="28"/>
    <rect x="222" y="356" width="66" height="28"/>
    <rect x="712" y="256" width="66" height="28"/>
    <rect x="705" y="356" width="80" height="28"/>
  </g>
  <text x="500" y="186" text-anchor="middle" class="lb">save / load</text>
  <text x="500" y="456" text-anchor="middle" class="lb">download</text>
  <text x="255" y="276" text-anchor="middle" class="lb">live data</text>
  <text x="255" y="376" text-anchor="middle" class="lb">loads</text>
  <text x="745" y="276" text-anchor="middle" class="lb">sync</text>
  <text x="745" y="376" text-anchor="middle" class="lb-g">planned</text>

  <!-- Centre -->
  <rect x="400" y="230" width="200" height="180" rx="16" fill="#eef2f7" stroke="#1f2328" stroke-width="2.5"/>
  <rect x="455" y="252" width="90" height="62" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="2.5"/>
  <rect x="480" y="265" width="40" height="34" rx="5" fill="#fdecea" stroke="#d1453b" stroke-width="2"/>
  <text x="500" y="288" text-anchor="middle" style="font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #d1453b;">HQ</text>
  <path d="M492 314 L487 328 H513 L508 314" fill="#ffffff" stroke="#1f2328" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="500" y="366" text-anchor="middle" class="ct">Antarasetu</text>
  <text x="500" y="390" text-anchor="middle" class="lb" style="fill:#57606a">HQ Dashboard</text>

  <!-- Top: Saved Data -->
  <text x="500" y="38" text-anchor="middle" class="nm">Saved Data</text>
  <g stroke="#1f2328" stroke-width="2.5" fill="#ffffff">
    <path d="M472 64 V118 A28 9 0 0 0 528 118 V64"/>
    <ellipse cx="500" cy="64" rx="28" ry="9"/>
    <path d="M472 82 A28 9 0 0 0 528 82 M472 100 A28 9 0 0 0 528 100" fill="none"/>
  </g>

  <!-- Bottom: Reports -->
  <g stroke="#b7860b" stroke-width="2.5" stroke-linejoin="round">
    <path d="M472 494 H490 L496 502 H528 V540 H472 Z" fill="#fbe3a0"/>
    <path d="M500 508 V530 M492 522 L500 530 L508 522" fill="none" stroke-linecap="round"/>
  </g>
  <text x="500" y="572" text-anchor="middle" class="nm">Reports</text>

  <!-- Top-left: NCPOR Weather -->
  <text x="110" y="100" text-anchor="middle" class="nm">NCPOR Weather</text>
  <g stroke="#ffffff" stroke-width="2.2" fill="none">
    <circle cx="106" cy="158" r="28" fill="#3b82d6" stroke="#1f5fa8" stroke-width="2.5"/>
    <ellipse cx="106" cy="158" rx="12" ry="28"/>
    <path d="M78 158 H134 M82 144 H130 M82 172 H130"/>
    <circle cx="106" cy="158" r="28" stroke="#1f5fa8" stroke-width="2.5"/>
  </g>
  <path d="M126 151 H140 V143 L155 158 L140 173 V165 H126 Z" fill="#f59e2a" stroke="#c77712" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Bottom-left: Climate Records -->
  <g stroke="#2e8b57" stroke-width="2.5" stroke-linejoin="round">
    <path d="M84 446 H124 L136 458 V504 H84 Z" fill="#e3f4ea"/>
    <path d="M124 446 V458 H136" fill="none"/>
    <path d="M93 494 L104 480 L113 487 L127 467" fill="none" stroke-linecap="round"/>
  </g>
  <text x="110" y="538" text-anchor="middle" class="nm">Climate Records</text>

  <!-- Top-right: Station -->
  <text x="890" y="100" text-anchor="middle" class="nm">Station</text>
  <g stroke="#6a4fb6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M890 146 L873 190 M890 146 L907 190 M879 175 H901 M883 162 H897"/>
    <circle cx="890" cy="142" r="5" fill="#6a4fb6"/>
    <path d="M876 130 A20 20 0 0 1 904 130 M868 122 A31 31 0 0 1 912 122"/>
  </g>

  <!-- Bottom-right: Future Sensors -->
  <g stroke="#8c959f" stroke-width="2.5" stroke-linecap="round" fill="none">
    <circle cx="890" cy="478" r="28" fill="#f3f5f7" stroke-dasharray="6 5"/>
    <path d="M870 486 A22 22 0 0 1 910 486"/>
    <path d="M890 488 L902 468" stroke-width="3"/>
    <circle cx="890" cy="488" r="4" fill="#8c959f" stroke="none"/>
  </g>
  <text x="890" y="538" text-anchor="middle" class="nm-g">Future Sensors</text>
</svg>
