<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1010" viewBox="0 0 1100 1010" role="img" aria-label="Antarasetu (DHRUVA) platform overview: a central digital twin platform for Bharati and Maitri, surrounded by eight capabilities: integrated digital twin, environmental monitoring, coupling engine and sandbox, autonomy and logistics, action centre, offline-first sync, audit and handover, and provenance and trust.">
  <style><![CDATA[
    .ttl { font: 700 20px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1f2d3d; }
    .sub { font: 500 13px "Cascadia Mono", Consolas, "SF Mono", monospace; fill: #5b6b7c; }
    .hub1 { font: 700 40px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1f2d3d; }
    .hub2 { font: 600 18px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #2c4c8c; }
    .hub3 { font: 500 13px "Cascadia Mono", Consolas, "SF Mono", monospace; fill: #5b6b7c; }
  ]]></style>
  <rect width="1100" height="1010" fill="#ffffff"/>

  <!-- Spokes: edge dot on the hub circle, dotted line, ringed dot -->
  <g stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" fill="none">
    <line x1="550" y1="350" x2="550" y2="281" stroke="#13908f"/>
    <line x1="677.3" y1="402.7" x2="726" y2="354" stroke="#2f7fd1"/>
    <line x1="730" y1="530" x2="799" y2="530" stroke="#2c4c8c"/>
    <line x1="677.3" y1="657.3" x2="726" y2="706" stroke="#3a9a58"/>
    <line x1="550" y1="710" x2="550" y2="779" stroke="#e0782a"/>
    <line x1="422.7" y1="657.3" x2="374" y2="706" stroke="#c49a1f"/>
    <line x1="370" y1="530" x2="301" y2="530" stroke="#7657c2"/>
    <line x1="422.7" y1="402.7" x2="374" y2="354" stroke="#237a6b"/>
  </g>

  <!-- Hub circle -->
  <circle cx="550" cy="530" r="186" fill="#f3f6fa"/>
  <circle cx="550" cy="530" r="180" fill="#ffffff" stroke="#4a5a6a" stroke-width="2.5"/>

  <g>
    <circle cx="550" cy="350" r="6" fill="#13908f"/>
    <circle cx="677.3" cy="402.7" r="6" fill="#2f7fd1"/>
    <circle cx="730" cy="530" r="6" fill="#2c4c8c"/>
    <circle cx="677.3" cy="657.3" r="6" fill="#3a9a58"/>
    <circle cx="550" cy="710" r="6" fill="#e0782a"/>
    <circle cx="422.7" cy="657.3" r="6" fill="#c49a1f"/>
    <circle cx="370" cy="530" r="6" fill="#7657c2"/>
    <circle cx="422.7" cy="402.7" r="6" fill="#237a6b"/>
  </g>
  <g stroke-width="4" fill="#ffffff">
    <circle cx="550" cy="265" r="15" stroke="#13908f"/><circle cx="550" cy="265" r="7" fill="#13908f" stroke="none"/>
    <circle cx="737.4" cy="342.6" r="15" stroke="#2f7fd1"/><circle cx="737.4" cy="342.6" r="7" fill="#2f7fd1" stroke="none"/>
    <circle cx="815" cy="530" r="15" stroke="#2c4c8c"/><circle cx="815" cy="530" r="7" fill="#2c4c8c" stroke="none"/>
    <circle cx="737.4" cy="717.4" r="15" stroke="#3a9a58"/><circle cx="737.4" cy="717.4" r="7" fill="#3a9a58" stroke="none"/>
    <circle cx="550" cy="795" r="15" stroke="#e0782a"/><circle cx="550" cy="795" r="7" fill="#e0782a" stroke="none"/>
    <circle cx="362.6" cy="717.4" r="15" stroke="#c49a1f"/><circle cx="362.6" cy="717.4" r="7" fill="#c49a1f" stroke="none"/>
    <circle cx="285" cy="530" r="15" stroke="#7657c2"/><circle cx="285" cy="530" r="7" fill="#7657c2" stroke="none"/>
    <circle cx="362.6" cy="342.6" r="15" stroke="#237a6b"/><circle cx="362.6" cy="342.6" r="7" fill="#237a6b" stroke="none"/>
  </g>

  <!-- Hub content -->
  <g stroke="#2c4c8c" stroke-width="3" stroke-linecap="round">
    <circle cx="550" cy="430" r="36" fill="#eef4fb"/>
    <line x1="550" y1="408" x2="550" y2="452"/>
    <line x1="531" y1="419" x2="569" y2="441"/>
    <line x1="531" y1="441" x2="569" y2="419"/>
    <path d="M544 411 L550 417 L556 411 M544 449 L550 443 L556 449" fill="none"/>
  </g>
  <text x="550" y="518" text-anchor="middle" class="hub1">Antarasetu</text>
  <text x="550" y="550" text-anchor="middle" class="hub2">DHRUVA · Digital Twin Platform</text>
  <text x="550" y="582" text-anchor="middle" class="hub3">for Bharati &amp; Maitri</text>
  <line x1="470" y1="598" x2="630" y2="598" stroke="#d6dde6" stroke-width="1.5"/>
  <text x="550" y="620" text-anchor="middle" class="hub3">infrastructure · energy</text>
  <text x="550" y="640" text-anchor="middle" class="hub3">logistics · environment</text>

  <!-- 0°: Integrated digital twin -->
  <g transform="translate(550,110)">
    <g transform="translate(-32,-32)" stroke="#13908f" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="32,6 58,19 32,32 6,19" fill="#13908f" fill-opacity=".18"/>
      <polygon points="6,19 32,32 32,58 6,45" fill="#ffffff"/>
      <polygon points="58,19 32,32 32,58 58,45" fill="#13908f"/>
      <path d="M13 29 V38 M20 32 V41 M25 35 V44" stroke-linecap="round"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Integrated</text>
    <text y="80" text-anchor="middle" class="ttl">Digital Twin</text>
    <text y="102" text-anchor="middle" class="sub">3D Bharati · iso Maitri</text>
  </g>

  <!-- 45°: Environmental monitoring -->
  <g transform="translate(864,208)">
    <g transform="translate(-32,-32)" stroke="#2f7fd1" stroke-width="2.5" stroke-linecap="round" fill="none">
      <rect x="12" y="6" width="12" height="36" rx="6" fill="#2f7fd1" fill-opacity=".15"/>
      <circle cx="18" cy="48" r="9" fill="#2f7fd1"/>
      <line x1="18" y1="22" x2="18" y2="44"/>
      <path d="M32 20 H50 A5 5 0 1 0 45 15"/>
      <path d="M32 32 H58"/>
      <path d="M32 44 H48 A5 5 0 1 1 43 49"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Environmental</text>
    <text y="80" text-anchor="middle" class="ttl">Monitoring</text>
    <text y="102" text-anchor="middle" class="sub">NCPOR AWS · SCAR · ERA5</text>
  </g>

  <!-- 90°: Coupling engine & sandbox -->
  <g transform="translate(962,480)">
    <g transform="translate(-32,-32)" stroke="#2c4c8c" stroke-width="2.5">
      <path d="M32 32 L11 12 M32 32 L53 12 M32 32 L11 52 M32 32 L53 52"/>
      <circle cx="11" cy="12" r="7" fill="#ffffff"/>
      <circle cx="53" cy="12" r="7" fill="#ffffff"/>
      <circle cx="11" cy="52" r="7" fill="#ffffff"/>
      <circle cx="53" cy="52" r="7" fill="#ffffff"/>
      <circle cx="32" cy="32" r="11" fill="#2c4c8c"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Coupling Engine</text>
    <text y="80" text-anchor="middle" class="ttl">&amp; Sandbox</text>
    <text y="102" text-anchor="middle" class="sub">runCausalTrace()</text>
  </g>

  <!-- 135°: Autonomy & logistics -->
  <g transform="translate(850,745)">
    <g transform="translate(-32,-32)" stroke="#3a9a58" stroke-width="2.5" stroke-linejoin="round">
      <rect x="14" y="24" width="12" height="12" fill="#3a9a58" fill-opacity=".18"/>
      <rect x="28" y="24" width="12" height="12" fill="#3a9a58" fill-opacity=".18"/>
      <rect x="28" y="10" width="12" height="12" fill="#3a9a58" fill-opacity=".18"/>
      <path d="M4 38 H60 L51 54 H13 Z" fill="#3a9a58"/>
      <path d="M8 60 Q16 56 24 60 T40 60 T56 60" fill="none" stroke-linecap="round"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Autonomy &amp;</text>
    <text y="80" text-anchor="middle" class="ttl">Logistics</text>
    <text y="102" text-anchor="middle" class="sub">LSOD · cargo manifest</text>
  </g>

  <!-- 180°: Action centre -->
  <g transform="translate(550,870)">
    <g transform="translate(-32,-32)" stroke="#e0782a" stroke-width="2.5" stroke-linejoin="round">
      <rect x="12" y="10" width="40" height="50" rx="5" fill="#e0782a" fill-opacity=".15"/>
      <rect x="23" y="5" width="18" height="10" rx="3" fill="#e0782a"/>
      <path d="M21 36 L29 44 L44 27" fill="none" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Action</text>
    <text y="80" text-anchor="middle" class="ttl">Centre</text>
    <text y="102" text-anchor="middle" class="sub">ACK · assign · escalate</text>
  </g>

  <!-- 225°: Offline-first sync -->
  <g transform="translate(250,745)">
    <g transform="translate(-32,-32)" stroke="#c49a1f" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M11 26 A22 22 0 0 1 50 16"/>
      <path d="M44 9 L51 16 L42 20" stroke-linejoin="round"/>
      <path d="M53 38 A22 22 0 0 1 14 48"/>
      <path d="M20 55 L13 48 L22 44" stroke-linejoin="round"/>
      <rect x="22" y="25" width="20" height="4" rx="2" fill="#c49a1f" stroke="none"/>
      <rect x="22" y="31" width="20" height="4" rx="2" fill="#c49a1f" stroke="none" fill-opacity=".6"/>
      <rect x="22" y="37" width="20" height="4" rx="2" fill="#c49a1f" stroke="none" fill-opacity=".3"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Offline-first</text>
    <text y="80" text-anchor="middle" class="ttl">Sync</text>
    <text y="102" text-anchor="middle" class="sub">outbox T0 → T3</text>
  </g>

  <!-- 270°: Audit & handover -->
  <g transform="translate(138,480)">
    <g transform="translate(-32,-32)" stroke="#7657c2" stroke-width="3">
      <rect x="4" y="22" width="34" height="20" rx="10" fill="#7657c2" fill-opacity=".15"/>
      <rect x="26" y="22" width="34" height="20" rx="10" fill="none"/>
      <path d="M14 52 H50 M14 58 H40" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".6"/>
      <path d="M14 8 H50 M14 14 H40" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".6"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Audit &amp;</text>
    <text y="80" text-anchor="middle" class="ttl">Handover</text>
    <text y="102" text-anchor="middle" class="sub">SHA-256 chain · capsule</text>
  </g>

  <!-- 315°: Provenance & trust -->
  <g transform="translate(236,208)">
    <g transform="translate(-32,-32)" stroke="#237a6b" stroke-width="2.5" stroke-linejoin="round">
      <path d="M32 5 L55 14 V31 C55 45 45 54 32 59 C19 54 9 45 9 31 V14 Z" fill="#237a6b" fill-opacity=".15"/>
      <path d="M21 32 L29 40 L44 24" fill="none" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text y="56" text-anchor="middle" class="ttl">Provenance</text>
    <text y="80" text-anchor="middle" class="ttl">&amp; Trust</text>
    <text y="102" text-anchor="middle" class="sub">LIVE · MODELED · SYNTH · SIM</text>
  </g>
</svg>
