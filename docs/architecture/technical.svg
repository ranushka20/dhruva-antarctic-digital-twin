<svg width="1400" height="960" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" role="img" aria-label="Technical architecture: data sources feed an ingest layer and localStorage; the shared contract and the state read layer feed the pages; the station console, outbox, link simulator and drain form the offline sync path to HQ. Amber paths show where Dev A pages read mock JSON directly and where the only real NCPOR feed reaches an orphaned legacy file.">
